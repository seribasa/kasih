name: Kasih Release All (Android + iOS + Tag)

on:
  workflow_dispatch:
    inputs:
      dev:
        description: Dev release (adds -dev suffix to release tag and marks as prerelease)
        type: boolean
        default: true
      payment_gateway:
        description: Payment gateway to build
        required: true
        default: midtrans
        type: choice
        options:
          - midtrans
          - stripe
          - both
      android_build_type:
        description: Android build type
        required: true
        default: release
        type: choice
        options:
          - debug
          - release
          - both
      ios_artifact_type:
        description: iOS artifact type
        required: true
        default: testflight
        type: choice
        options:
          - ipa
          - testflight
      upload_to_testflight:
        description: Upload signed IPA to TestFlight
        type: boolean
        default: true
      wait_for_processing:
        description: Wait for App Store to finish processing the build
        type: boolean
        default: true
      midtrans_currency:
        description: Midtrans currency supported by backend
        required: true
        default: IDR
        type: string
      stripe_currency:
        description: Stripe currency supported by backend
        required: true
        default: IDR
        type: string
      version_name:
        description: Version name override (leave blank for CalVer YYYY.MM.DD)
        required: false
        type: string
        default: ''
      build_number:
        description: Build number override (leave blank for Unix timestamp)
        required: false
        type: string
        default: ''
      release_notes:
        description: Release notes for TestFlight testers
        required: false
        type: string
        default: 'Internal test build'

permissions:
  contents: read

concurrency:
  group: release-all-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare shared version & tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      build_number: ${{ steps.version.outputs.build_number }}
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate shared version and build number
        id: version
        run: node .github/scripts/version-manager.mjs --bump --ci
        env:
          CUSTOM_VERSION_NAME: ${{ inputs.version_name }}
          CUSTOM_BUILD_NUMBER: ${{ inputs.build_number }}
      - name: Compute and validate release tag
        id: tag
        uses: actions/github-script@v7
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          IS_DEV: ${{ inputs.dev }}
        with:
          script: |
            const suffix = process.env.IS_DEV === 'true' ? '-dev' : '';
            const tag = `v${process.env.VERSION_NAME}-${process.env.BUILD_NUMBER}${suffix}`;
            if (!/^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$/.test(tag)) {
              throw new Error(`Invalid generated release tag: ${tag}`);
            }
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              throw new Error(`Tag ${tag} already exists; supply a unique build_number.`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('release_tag', tag);

  android:
    needs: prepare
    uses: ./.github/workflows/development_apk.yml
    secrets: inherit
    with:
      payment_gateway: ${{ inputs.payment_gateway }}
      build_type: ${{ inputs.android_build_type }}
      midtrans_currency: ${{ inputs.midtrans_currency }}
      stripe_currency: ${{ inputs.stripe_currency }}
      version_name: ${{ needs.prepare.outputs.version_name }}
      build_number: ${{ needs.prepare.outputs.build_number }}

  ios:
    needs: prepare
    uses: ./.github/workflows/development_ios.yml
    secrets: inherit
    with:
      artifact_type: ${{ inputs.ios_artifact_type }}
      upload_to_testflight: ${{ inputs.upload_to_testflight }}
      payment_gateway: ${{ inputs.payment_gateway }}
      midtrans_currency: ${{ inputs.midtrans_currency }}
      stripe_currency: ${{ inputs.stripe_currency }}
      version_name: ${{ needs.prepare.outputs.version_name }}
      build_number: ${{ needs.prepare.outputs.build_number }}
      export_method: app-store-connect
      release_notes: ${{ inputs.release_notes }}
      wait_for_processing: ${{ inputs.wait_for_processing }}

  release:
    name: Create GitHub Release (${{ needs.prepare.outputs.release_tag }})
    needs: [prepare, android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release helpers
        run: node --test .github/scripts/release-assets.test.mjs
      - name: Download Android build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e-patient-*-*-${{ github.run_id }}
          path: release-downloads/android
      - name: Download signed IPA artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: e-patient-*-signed-ipa-${{ github.run_id }}
          path: release-downloads/ios
      - name: Select binaries and generate checksums
        run: node .github/scripts/release-assets.mjs
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ANDROID_RUN_ID: ${{ github.run_id }}
          IOS_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
      - name: Publish persistent release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          PRERELEASE: ${{ inputs.dev }}
        run: |
          flags=(--draft)
          if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --target "${{ github.sha }}" --title "Kasih $RELEASE_TAG" --notes-file release-assets/RELEASE-NOTES.md "${flags[@]}"
          shopt -s nullglob
          assets=(release-assets/*.apk release-assets/*.ipa release-assets/SHA256SUMS)
          gh release upload "$RELEASE_TAG" "${assets[@]}"
          gh release edit "$RELEASE_TAG" --draft=false
