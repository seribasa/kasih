name: Kasih Deploy TestFlight iOS

on:
  workflow_dispatch:
    inputs:
      payment_gateway:
        description: Payment gateway
        type: choice
        default: midtrans
        options: [midtrans, stripe]
      midtrans_currency:
        description: Midtrans currency supported by backend
        type: string
        default: IDR
      stripe_currency:
        description: Stripe currency supported by backend
        type: string
        default: IDR
      version_name:
        description: Version name override (leave blank for CalVer YYYY.MM.DD)
        required: false
        type: string
        default: ''
      build_number:
        description: Build number override (leave blank for Unix timestamp)
        required: false
        type: string
        default: ''
      release_notes:
        description: Release notes for TestFlight testers
        required: false
        type: string
        default: 'Internal test build'
      environment:
        description: GitHub Environment containing secrets
        type: choice
        default: testflight
        options: [testflight, development, production]
      wait_for_processing:
        description: Wait for App Store to finish processing the build
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight (${{ inputs.payment_gateway }})
    runs-on: macos-15
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Check toolchain and test build helpers
        run: |
          xcodebuild -version
          pod --version
          node --test .github/scripts/*.test.mjs

      - name: Validate and configure App Store Connect API credentials
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: node .github/scripts/app-store-connect.mjs install

      - name: Prepare placeholder configuration
        run: node .github/scripts/write-app-env.mjs --ci

      - name: Resolve dependencies and generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --coverage --reporter expanded

      - name: Create deployment configuration
        run: node .github/scripts/write-app-env.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PAYMENT_URL: ${{ inputs.payment_gateway == 'midtrans' && secrets.PAYMENT_URL_MIDTRANS || inputs.payment_gateway == 'stripe' && secrets.PAYMENT_URL_STRIPE || secrets.PAYMENT_URL }}
          STRIPE_PUBLISHABLE_KEY: ${{ inputs.payment_gateway == 'stripe' && secrets.STRIPE_PUBLISHABLE_KEY || '' }}
          PAYMENT_GATEWAY: ${{ inputs.payment_gateway }}
          PAYMENT_CURRENCY: ${{ inputs.payment_gateway == 'midtrans' && inputs.midtrans_currency || inputs.stripe_currency }}
          AUTH_REDIRECT_URL: ${{ vars.AUTH_REDIRECT_URL || 'https://kasih-app.peltops.com/' }}

      - name: Configure build version
        id: version
        run: node .github/scripts/version-manager.mjs --bump --ci
        env:
          CUSTOM_VERSION_NAME: ${{ inputs.version_name }}
          CUSTOM_BUILD_NUMBER: ${{ inputs.build_number }}

      - name: Install Apple distribution signing credentials
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_EXPORT_METHOD: 'app-store-connect'
        run: node .github/scripts/ios-signing.mjs install

      - name: Archive and export App Store IPA
        run: |
          flutter build ios --release --config-only --build-name="${{ steps.version.outputs.version_name }}" --build-number="${{ steps.version.outputs.build_number }}"
          ruby .github/scripts/configure-ios-project.rb
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/kasih.xcarchive" \
            archive
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/kasih.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/kasih-ios-signing/ExportOptions.plist" \
            -exportPath build/ios/ipa

      - name: Locate exported IPA
        id: locate-ipa
        run: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No exported .ipa file found in build/ios/ipa"
            exit 1
          fi
          echo "Found IPA: $IPA_PATH"
          echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: kasih-${{ inputs.payment_gateway }}-testflight-ipa-${{ github.run_id }}
          path: ${{ steps.locate-ipa.outputs.ipa_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.locate-ipa.outputs.ipa_path }}
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ runner.temp }}/appstore_connect_key.p8
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: false
          wait-for-processing: ${{ inputs.wait_for_processing }}

      - name: Remove Apple signing material
        if: always()
        run: node .github/scripts/ios-signing.mjs cleanup

      - name: Remove App Store Connect key
        if: always()
        run: node .github/scripts/app-store-connect.mjs cleanup

      - name: Remove bundled configuration
        if: always()
        run: rm -f .env
